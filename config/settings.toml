[general]
mode = "collage"
selection = "random"
interval = 300
collage_count = 4
collage_same_for_all = false
language = "en"
# Come up hidden in the tray. Always in effect when Windows starts the app itself;
# turn this on to get the same behaviour when launching it by hand.
start_minimized = false
# Ask GitHub once at startup whether a newer release exists. Turn this off to stop
# the app reaching the network on its own; the Settings screen can still check by hand.
check_updates = true
# Written by the engine, not by hand: whether rotation was running when the app was
# last closed. It is restored on the next launch.
rotation_active = false

[paths]
wallpapers_folder = "C:\\Users\\Public\\Pictures"
output_folder = "output"
default_wallpaper = ""

[display]
fit_mode = "fill"
effect = "normal"

# No shortcut is bound out of the box: a global hotkey belongs to one process on
# Windows, so claiming a dozen of them on first run steals combinations from
# whatever the user already runs. Empty means "not registered" — assign the ones
# you want from the Hotkeys screen.
[hotkeys]
next_wallpaper = ""
prev_wallpaper = ""
stop_watch = ""
default_wallpaper = ""
toggle_transparency = ""
toggle_window = ""
# Not shortcuts. Hold scroll_modifier and turn the wheel to fade the focused
# window. Off by default because it installs a system-wide mouse hook.
scroll_enabled = false
scroll_modifier = "alt"          # alt | ctrl | shift | win
effect_normal = ""
effect_bw = ""
effect_vintage = ""
effect_hdr = ""
toggle_video = ""
toggle_video_sound = ""
next_video = ""
prev_video = ""

[video]
# Also the remembered state: set when the video wallpaper is started or stopped,
# and restored on the next launch.
enabled = false
folder = "C:/Users/klysm/Videos/wuwa"
loop = false
sound = true
