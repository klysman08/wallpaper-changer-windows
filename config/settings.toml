[general]
mode = "collage"
selection = "random"
interval = 300
collage_count = 4
collage_same_for_all = false
language = "en"

[paths]
wallpapers_folder = "C:\\Users\\Public\\Pictures"
output_folder = "output"
default_wallpaper = ""

[display]
fit_mode = "fill"
effect = "normal"

# No shortcut is bound out of the box: a global hotkey belongs to one process on
# Windows, so claiming a dozen of them on first run steals combinations from
# whatever the user already runs. Empty means "not registered" — assign the ones
# you want from the Hotkeys screen.
[hotkeys]
next_wallpaper = ""
prev_wallpaper = ""
stop_watch = ""
default_wallpaper = ""
toggle_transparency = ""
toggle_window = ""
# Not a shortcut: the modifier held while scrolling to change window transparency.
scroll_modifier = "alt"
effect_normal = ""
effect_bw = ""
effect_vintage = ""
effect_hdr = ""
toggle_video = ""
toggle_video_sound = ""
next_video = ""
prev_video = ""

[video]
enabled = false
folder = "C:/Users/klysm/Videos/wuwa"
loop = false
sound = true
