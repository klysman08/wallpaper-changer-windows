[package]
name = "wallpaper-core"
version = "5.4.0"
edition = "2021"
description = "Wallpaper Changer engine core: config, composition, Win32, video."

# Deliberately no `tauri` dependency. The core must stay testable headless, and
# nothing in it should need an AppHandle to do its work — the shell reaches it
# through `Core::dispatch` and hears back through `EventSink`.

[dependencies]
serde_json = "1"
base64 = "0.22"
# Not the `toml` crate: settings.toml ships with explanatory comments that the
# hand-rolled Python writer destroys on every save. toml_edit keeps them.
toml_edit = "0.22"
dunce = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The apply lock and the rotation timer. `rt` is for `spawn_blocking`: compositing a
# 5760x2160 canvas must not sit on an async worker.
tokio = { version = "1", features = ["sync", "time", "rt"] }

# `SUPPORTED` in image_utils.py is jpg/jpeg/png/bmp/webp, so those are the decoders
# that must exist. Encoding is only ever JPEG (thumbnails, previews) and BMP (the
# wallpaper Windows requires) for now; PNG and WebP encoders arrive with the
# save-collage work in phase 4.
[dependencies.image]
version = "0.25"
default-features = false
features = ["jpeg", "png", "bmp", "webp"]

# Pinned to what Tauri already resolves (`cargo tree -i windows`), so cargo unifies
# the two and this costs no extra compile. Deliberately not `windows-sys` alongside:
# two crates would mean two incompatible HWND newtypes and a cast at every boundary.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61.3"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
]

[dev-dependencies]
# Only to drive the async `dispatch` from tests; the crate itself is runtime-agnostic.
tokio = { version = "1", features = ["rt", "macros"] }
