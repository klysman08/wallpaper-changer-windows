[workspace]
members = ["crates/wallpaper-core", "crates/wallpaper-core-cli"]

[package]
name = "tauri-native"
version = "5.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri-plugin-log = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Request/response correlation for the Python engine sidecar.
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
wallpaper-core = { path = "crates/wallpaper-core" }


[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true      # Keeps debug symbols out of the shipped .exe.
# `unwind`, not `abort`: the engine core catches panics and turns them into an
# `internal` error envelope, matching what rpc.py's catch-all does today. Under
# `abort` a corrupt image would take down the tray, the hotkeys and the window
# instead of failing one call. See `wallpaper_core::guard`.
panic = "unwind"
# MSVC keeps debug info in a separate .pdb, so this costs the installer nothing —
# the bundler ships only the .exe — but leaves a symbolised stack for the dxgi
# access violations the video layer is known to produce.
debug = "line-tables-only"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# Only pulled in for relaunch() after an update installs.
tauri-plugin-process = "2"
